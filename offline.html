<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b36">
  <meta name="robots" content="noindex">
  <title>ACERVO — Sem conexão</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;color:#24483a;background:#f8f7f2}
    body{display:grid;place-items:center;min-height:100dvh;padding:30px;line-height:1.6}
    main{max-width:410px;text-align:center}
    img{height:88px;width:88px;border-radius:20px;box-shadow:0 12px 28px #102f2d20}
    h1{font:normal 38px/1.1 Georgia,serif;margin:27px 0 15px;color:#173b36}
    p{font-size:14px;color:#6e8373;margin:0 0 28px}
    button{background:#173b36;color:white;border:0;border-radius:12px;padding:15px 30px;font-weight:700;font-size:14px}
    small{display:block;font-size:11px;color:#91a293;margin:24px 0}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" width="88" height="88" alt="Ícone do ACERVO">
    <h1>Seu ACERVO continua aqui.</h1>
    <p>Você está sem conexão. As referências ficam protegidas na nuvem e precisam de internet para carregar ou serem alteradas. Conecte-se para retomar de onde parou.</p>
    <button type="button" onclick="location.reload()">Tentar novamente ↗</button>
    <small>Nenhuma informação foi apagada. Se você estava preenchendo um card ainda não salvo, volte quando tiver conexão.</small>
  </main>
</body>
</html>
